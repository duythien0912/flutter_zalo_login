# Step 3 regression: after login, isAuthenticated() reports true
# (previously stayed false). Verified via the non-transient step-3 details sheet.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- tapOn: "Init Zalo"
- extendedWaitUntil:
    visible: "Init success"
    timeout: 10000

- tapOn: "Login Zalo"
- extendedWaitUntil:
    visible: "Details login"
    timeout: 120000

- tapOn: "Check Auth"
- extendedWaitUntil:
    visible: "Details auth"
    timeout: 10000
- tapOn: "Details auth"
- assertVisible: "Is Authenticated: true"
- takeScreenshot: 04_authenticated

# Step 1: init returns the Android hash key. Login-independent.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- tapOn: "Init Zalo"
# init toast fires immediately (instant action → reliable)
- extendedWaitUntil:
    visible: "Init success"
    timeout: 10000
# non-transient proof: the hash-key details sheet
- tapOn: "Details hash key"
- assertVisible: "Android Hash Key"
- takeScreenshot: 01_init_hashkey

# Step 5 logout: after login, Logout clears the session — the login details
# affordance disappears and step 3 reports not authenticated.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- tapOn: "Init Zalo"
- extendedWaitUntil:
    visible: "Init success"
    timeout: 10000

- tapOn: "Login Zalo"
- extendedWaitUntil:
    visible: "Details login"
    timeout: 120000

# logout (step 5) clears the session
- tapOn: "Logout"
- extendedWaitUntil:
    visible: "Logged out"
    timeout: 10000
- assertNotVisible: "Details login"

# step 3 now reports not authenticated (via its details sheet)
- tapOn: "Check Auth"
- extendedWaitUntil:
    visible: "Details auth"
    timeout: 10000
- tapOn: "Details auth"
- assertVisible: "Is Authenticated: false"
- takeScreenshot: 03_after_logout

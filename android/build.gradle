group = "com.neun.flutter_zalo_login.flutter_zalo_login"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:8.7.0"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "com.neun.flutter_zalo_login.flutter_zalo_login"
    compileSdk = 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 21
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    lint {
        disable "InvalidPackage"
    }
}

dependencies {
    // Zalo SDK v4 (Maven Central, group `me.zalo`). jcenter is dead.
    // sdk-openapi transitively pulls sdk-auth + sdk-core.
    api "me.zalo:sdk-openapi:4.2.0724"
    api "me.zalo:sdk-auth:4.2.0724"
    api "me.zalo:sdk-core:4.2.0724"
}
